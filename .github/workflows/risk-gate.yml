name: risk-gate
on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON array of runner labels, e.g. '["ubuntu-latest"]'
        type: string
        required: true
      mode:
        type: string
        default: shadow
      weights-version:
        type: string
        default: "2"
      risk-gate-ref:
        description: Commit SHA the caller pinned this workflow to
        type: string
        required: true
permissions: {}
concurrency:
  group: risk-gate-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  score:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Check inputs
        env:
          RISK_GATE_REF: ${{ inputs.risk-gate-ref }}
          MODE: ${{ inputs.mode }}
          WEIGHTS_VERSION: ${{ inputs.weights-version }}
        run: |
          [[ "$RISK_GATE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::risk-gate-ref must be a 40-char commit SHA"; exit 1; }
          [[ "$MODE" == shadow || "$MODE" == enforce ]] || { echo "::error::mode must be shadow or enforce"; exit 1; }
          [[ "$WEIGHTS_VERSION" =~ ^[0-9]+$ ]] || { echo "::error::weights-version must be a number"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/review-tiers.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"
          cache: false
      - name: Install risk-gate
        env:
          RISK_GATE_REF: ${{ inputs.risk-gate-ref }}
        run: go install "github.com/bearingsoftware/risk-gate/cmd/risk-gate@${RISK_GATE_REF}"
      - name: Score
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MODE: ${{ inputs.mode }}
          WEIGHTS_VERSION: ${{ inputs.weights-version }}
        run: |
          "$(go env GOPATH)/bin/risk-gate" score \
            --repo "$REPO" --pr "$PR" --mode "$MODE" --weights-version "$WEIGHTS_VERSION" \
            --tiers .github/review-tiers.yml --out risk-decision.json --publish --label
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: risk-decision
          path: risk-decision.json
          if-no-files-found: ignore
          retention-days: 14
